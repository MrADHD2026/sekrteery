plugins {
    id 'com.android.application'
}

def vCode = (System.getenv('VERSION_CODE') ?: '1') as Integer
def ksPath = System.getenv('SK_KEYSTORE') ?: 'missing.jks'
def hasKs = file(ksPath).exists()

android {
    namespace 'com.sekrteery.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sekrteery.app'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    signingConfigs {
        release {
            storeFile hasKs ? file(ksPath) : null
            storePassword System.getenv('SK_KEYSTORE_PASS') ?: 'sekrteery-local'
            keyAlias 'sekrteery'
            keyPassword System.getenv('SK_KEYSTORE_PASS') ?: 'sekrteery-local'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // لو مفتاح التوقيع موجود (من أسرار GitHub) نستخدمه عشان التحديثات تنزل فوق القديم بدون حذف
            signingConfig hasKs ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            // نفس ملفات الموقع (www) تنحط داخل التطبيق
            assets.srcDirs = ['../../www']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
