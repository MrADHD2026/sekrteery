name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KS: ${{ secrets.SK_KEYSTORE_B64 }}
          KP: ${{ secrets.SK_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::No signing key secret; building with debug key"
            exit 0
          fi
          # ننظف القيمة من أي مسافات أو أسطر زايدة انلصقت بالغلط
          printf '%s' "$KS" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/ks.b64"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/sk.jks" 2>/dev/null; then
            echo "::error::SK_KEYSTORE_B64 is not valid base64 (length $(wc -c < "$RUNNER_TEMP/ks.b64"))"
            exit 1
          fi
          KP_CLEAN=$(printf '%s' "$KP" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$RUNNER_TEMP/sk.jks" -storepass "$KP_CLEAN" >/dev/null 2>&1; then
            echo "::error::Keystore decoded ($(wc -c < "$RUNNER_TEMP/sk.jks") bytes) but SK_KEYSTORE_PASS does not open it"
            exit 1
          fi
          echo "SK_KEYSTORE=$RUNNER_TEMP/sk.jks" >> "$GITHUB_ENV"
          echo "SK_KEYSTORE_PASS=$KP_CLEAN" >> "$GITHUB_ENV"
          echo "::notice::Signed with the permanent key"

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk sekrteery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sekrteery-apk
          path: sekrteery.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: سكرتيري 1.0.${{ github.run_number }}
          make_latest: true
          files: sekrteery.apk
          body: |
            نزّل ملف sekrteery.apk على جوالك وثبّته.
