name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signing key
        env:
          KS: ${{ secrets.SK_KEYSTORE_B64 }}
          KP: ${{ secrets.SK_KEYSTORE_PASS }}
        run: |
          KP_CLEAN=$(printf '%s' "$KP" | tr -d ' \r\n\t')
          ok=0
          # الطريقة ١: المفتاح كامل في سر SK_KEYSTORE_B64
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/sk.jks" 2>/dev/null || true
            keytool -list -keystore "$RUNNER_TEMP/sk.jks" -storepass "$KP_CLEAN" >/dev/null 2>&1 && ok=1
          fi
          # الطريقة ٢: المفتاح مشفّر داخل المستودع، ويكفي سر كلمة المرور
          if [ "$ok" = 0 ] && [ -n "$KP_CLEAN" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/sekrteery.jks.enc -out "$RUNNER_TEMP/sk.jks" -pass "pass:$KP_CLEAN" 2>/dev/null \
              && keytool -list -keystore "$RUNNER_TEMP/sk.jks" -storepass "$KP_CLEAN" >/dev/null 2>&1 && ok=1
          fi
          if [ "$ok" = 1 ]; then
            echo "SK_KEYSTORE=$RUNNER_TEMP/sk.jks" >> "$GITHUB_ENV"
            echo "SK_KEYSTORE_PASS=$KP_CLEAN" >> "$GITHUB_ENV"
            echo "::notice::Signed with the permanent key"
          else
            echo "::warning::Permanent key not available (pass length ${#KP_CLEAN}); building with temporary debug key"
          fi

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk sekrteery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sekrteery-apk
          path: sekrteery.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: سكرتيري 1.0.${{ github.run_number }}
          make_latest: true
          files: sekrteery.apk
          body: |
            نزّل ملف sekrteery.apk على جوالك وثبّته.
